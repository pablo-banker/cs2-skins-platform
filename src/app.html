<!doctype html>
<!-- The app is dark-first: the `dark` class is permanent, there is no light theme. -->
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#080A0D" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!--
			SvelteKit's recommended body wrapper, as a class rather than the
			`style="display: contents"` its template suggests: an inline style
			attribute cannot be hashed by CSP, so it would force
			`style-src 'unsafe-inline'` for one declaration.
		-->
		<div class="contents">%sveltekit.body%</div>
	</body>
</html>
